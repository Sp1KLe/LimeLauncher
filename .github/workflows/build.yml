name: Build LimeLauncher

# ЕДИНСТВЕННАЯ сборка проекта. Всегда собирает полный лаунчер (с Java, Minecraft 1.18.2).
# Основа: PojavLauncher (LGPL-3.0), поверх накладываются изменения LimeLauncher.
# Скачивать нужно артефакт "LimeLauncher-full-<номер сборки>".

on:
  push:
  workflow_dispatch:

env:
  POJAV_REPO: https://github.com/TeamPojavLauncher/PojavLauncher
  POJAV_SHA: 94305d6a0c25bc4f415df1f52bac6f51870d5ad1

jobs:
  test:
    name: Rust core tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p lime-core --release

  full:
    name: Full launcher APK
    runs-on: ubuntu-22.04
    permissions:
      contents: write   # нужно, чтобы выкладывать APK в Releases
    steps:
      - name: Checkout LimeLauncher
        uses: actions/checkout@v4
        with:
          path: lime

      - name: Fetch PojavLauncher (pinned)
        run: |
          mkdir pojav && cd pojav
          git init -q
          git remote add origin "$POJAV_REPO"
          git fetch --depth 1 origin "$POJAV_SHA"
          git checkout -q FETCH_HEAD
          git submodule update --init --recursive --depth 1

      - name: Apply LimeLauncher changes
        env:
          LIME_BUILD: ${{ github.run_number }}
        run: bash lime/scripts/apply-lime.sh pojav

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Get LTW (graphics layer)
        uses: dawidd6/action-download-artifact@v6
        continue-on-error: true
        with:
          repo: MojoLauncher/LTW
          workflow: android.yml
          workflow_conclusion: success
          name: output-aar
          path: pojav/app_pojavlauncher/libs

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.5"

      - name: Build APK (with Java runtimes)
        working-directory: pojav
        run: gradle :app_pojavlauncher:assembleFullDebug --no-daemon

      - name: Collect APK
        run: |
          mkdir out
          cp pojav/app_pojavlauncher/build/outputs/apk/full/debug/*.apk "out/LimeLauncher-${{ github.run_number }}.apk"
          ls -la out

      # Проверка перед публикацией: если APK битый или не подписан, сборка падает,
      # а не выкладывает файл, который телефон назовёт «недействительным пакетом».
      - name: Verify APK (zip, signature, manifest)
        run: |
          set -e
          APK="out/LimeLauncher-${{ github.run_number }}.apk"
          BT="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          echo "build-tools: $BT"
          unzip -tq "$APK"
          "$BT/apksigner" verify --verbose --print-certs "$APK"
          "$BT/aapt" dump badging "$APK" | grep -E "^package:|^sdkVersion|^targetSdkVersion|^application-label:|^native-code" || true
          ls -l "$APK"

      - uses: actions/upload-artifact@v4
        with:
          name: LimeLauncher-full-${{ github.run_number }}
          path: out/LimeLauncher-${{ github.run_number }}.apk

      # Прямая ссылка на .apk без zip: открывается на телефоне в браузере (раздел Releases).
      - name: Publish release (direct APK download)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "build-${{ github.run_number }}" \
            "out/LimeLauncher-${{ github.run_number }}.apk" \
            --repo "${{ github.repository }}" \
            --title "LimeLauncher #${{ github.run_number }}" \
            --notes "Сборка #${{ github.run_number }} (коммит ${GITHUB_SHA::7}). Скачайте .apk и установите." \
            --latest
