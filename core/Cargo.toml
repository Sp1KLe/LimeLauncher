[package]
name = "lime-core"
version = "0.1.0"
edition = "2021"
description = "Ядро LimeLauncher: версии, запуск Java Edition, управление в стиле Bedrock"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
# JNI-мост для Android (включается при сборке APK)
jni-bridge = ["dep:jni"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
ureq = { version = "2", default-features = false, features = ["tls"] }
jni = { version = "0.21", optional = true }
